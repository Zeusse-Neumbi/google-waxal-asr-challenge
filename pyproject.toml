[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waxal-asr"
version = "0.1.0"
description = "State-of-the-art multilingual ASR pipeline for the Google WAXAL ASR Challenge."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "WAXAL ASR Contributors" },
]
keywords = ["asr", "speech-recognition", "whisper", "waxal", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.12,<2.0",
    "librosa>=0.10,<0.11",
    "soundfile>=0.12,<0.13",
    "torch>=2.2,<2.14",
    "torchaudio>=2.2,<2.12",
    "transformers>=4.40,<5.14",
    "datasets>=2.19,<6.0",
    "accelerate>=0.30,<2.0",
    "evaluate>=0.4,<0.5",
    "huggingface-hub>=0.23,<0.25",
    "jiwer>=3.0,<4.0",
    "python-Levenshtein>=0.25,<0.26",
    "omegaconf>=2.3,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "tqdm>=4.66,<5.0",
    "loguru>=0.7,<0.8",
    "rich>=13.7,<14.0",
    "typer>=0.12,<0.13",
    "platformdirs>=4.2,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-xdist>=3.6,<4.0",
    "ruff>=0.4,<0.6",
    "black>=24.4,<25.0",
    "isort>=5.13,<6.0",
    "mypy>=1.10,<1.12",
    "pre-commit>=3.7,<4.0",
    "nbstripout>=0.7,<0.8",
]
tracking = [
    "wandb>=0.16,<0.18",
]
hydra = [
    "hydra-core>=1.3,<2.0",
]
notebook = [
    "jupyter>=1.0,<2.0",
    "jupyterlab>=4.2,<5.0",
    "ipykernel>=6.29,<7.0",
]
all = [
    "waxal-asr[dev,tracking,hydra,notebook]",
]

[project.urls]
"Homepage" = "https://github.com/nkz/google-waxal-asr-challenge"
"Repository" = "https://github.com/nkz/google-waxal-asr-challenge"
"Issues" = "https://github.com/nkz/google-waxal-asr-challenge/issues"

[project.scripts]
waxal-train = "waxal_asr.cli.train:main"
waxal-eval = "waxal_asr.cli.evaluate:main"
waxal-infer = "waxal_asr.cli.infer:main"
waxal-submit = "waxal_asr.cli.submit:main"

# --- setuptools config ---
[tool.setuptools.packages.find]
where = ["src"]
include = ["waxal_asr*"]

[tool.setuptools.package-data]
"waxal_asr" = ["py.typed"]

# --- Black ---
[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | build
  | dist
  | notebooks
)/
'''

# --- isort ---
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["waxal_asr"]
known_third_party = [
    "torch", "torchaudio", "transformers", "datasets", "accelerate",
    "evaluate", "librosa", "soundfile", "numpy", "pandas", "scipy",
    "jiwer", "omegaconf", "hydra", "yaml", "tqdm", "loguru", "rich",
    "typer", "wandb",
]
force_sort_within_sections = true

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by black
    "B008",  # function calls in defaults (typer pattern)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["B011", "S101"]
"notebooks/**" = ["E402", "F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["waxal_asr"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- MyPy ---
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = [
    "notebooks/",
    "build/",
    "dist/",
]
explicit_package_bases = true
namespace_packages = true

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--cov=waxal_asr",
    "--cov-report=term-missing",
    "--cov-report=html:outputs/coverage/html",
    "--cov-report=xml:outputs/coverage/coverage.xml",
]
markers = [
    "unit: fast unit tests with no external dependencies.",
    "integration: tests that combine multiple components.",
    "slow: tests that take more than a few seconds.",
    "gpu: tests requiring a GPU.",
    "network: tests requiring internet access.",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:transformers.*",
    "ignore::UserWarning:torchvision.*",
]

# --- Coverage ---
[tool.coverage.run]
source = ["src/waxal_asr"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/cli/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
