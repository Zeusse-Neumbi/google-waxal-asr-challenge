# ──────────────────────────────────────────────────────────────
# Gemma 4n E4B — Shona (sna) fine-tune
# Larger model, requires A100 (40 GB).
# ──────────────────────────────────────────────────────────────

defaults: [baseline]

dataset:
  language: sna
  num_validation_examples: 200

model:
  model_id: google/gemma-4n-E4B-it
  model_type: gemma3n
  torch_dtype: bfloat16

lora:
  enabled: true
  r: 8
  alpha: 16
  target_modules: [v_proj, o_proj]

training:
  max_steps: 500
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  max_seq_length: 64

optimizer:
  lr: 1.0e-3
