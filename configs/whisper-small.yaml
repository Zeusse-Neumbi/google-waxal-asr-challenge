# ──────────────────────────────────────────────────────────────
# Whisper-small baseline configuration.
# Inherits from baseline.yaml.
# ──────────────────────────────────────────────────────────────

defaults: [baseline]

raw:
  experiment:
    name: whisper_small_baseline
    number: 001
    description: "Whisper-small fine-tune baseline on WAXAL."

model:
  model_id: openai/whisper-small
  model_type: whisper
  torch_dtype: float16
  load_in_4bit: false

training:
  max_steps: 5000
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  max_seq_length: 448

optimizer:
  lr: 5.0e-6
  weight_decay: 0.01

scheduler:
  name: linear
  warmup_ratio: 0.1

augmentation:
  enabled: false
