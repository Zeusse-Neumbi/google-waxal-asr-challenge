# ──────────────────────────────────────────────────────────────
# Gemma 3n E2B — Shona (sna) fine-tune
# Inherits all defaults from baseline, overrides model + dataset.
# ──────────────────────────────────────────────────────────────

defaults: [baseline]

dataset:
  language: sna
  num_validation_examples: 200

model:
  model_id: google/gemma-3n-E2B-it
  model_type: gemma3n
  torch_dtype: bfloat16

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.0
  target_modules: [v_proj, o_proj]

training:
  max_steps: 500
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  max_seq_length: 64
  logging_steps: 10
  eval_steps: 100
  save_steps: 100

optimizer:
  lr: 1.0e-3
