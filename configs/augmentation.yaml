# ──────────────────────────────────────────────────────────────
# Augmentation library configuration.
# Applied to training data only — never to dev/test.
# ──────────────────────────────────────────────────────────────

augmentation:
  enabled: true
  seed: 42

  # --- SpecAugment ---
  specaugment:
    enabled: true
    time_mask_param: 30
    freq_mask_param: 15
    n_time_masks: 2
    n_freq_masks: 2
    mask_value: 0

  # --- Additive noise ---
  noise:
    enabled: true
    noise_dir: ${paths.data_external}/musan
    snr_db_min: 10
    snr_db_max: 25
    p: 0.5

  # --- Speed perturbation ---
  speed_perturbation:
    enabled: true
    factors: [0.9, 1.0, 1.1]
    p: 0.3

  # --- Gain perturbation ---
  gain:
    enabled: false
    db_min: -6
    db_max: 6
    p: 0.3
