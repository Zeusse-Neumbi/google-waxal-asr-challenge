# ──────────────────────────────────────────────────────────────
# Whisper large-v3 configuration.
# ──────────────────────────────────────────────────────────────

defaults: [baseline]

raw:
  experiment:
    name: whisper_large_v3_finetune
    number: 003
    description: "Whisper-large-v3 fine-tune on WAXAL."

model:
  model_id: openai/whisper-large-v3
  model_type: whisper
  torch_dtype: float16
  load_in_4bit: true

training:
  max_steps: 6000
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  max_seq_length: 448

optimizer:
  lr: 1.0e-6
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_ratio: 0.15

augmentation:
  enabled: true
  specaugment:
    time_mask_param: 40
    freq_mask_param: 20
    n_time_masks: 2
    n_freq_masks: 2
  noise:
    enabled: true
    snr_db_min: 10
    snr_db_max: 25
  speed_perturbation:
    enabled: true
    factors: [0.9, 1.0, 1.1]
