# ──────────────────────────────────────────────────────────────
# Inference / submission configuration.
# ──────────────────────────────────────────────────────────────

defaults: [baseline]

raw:
  inference:
    beam_size: 1
    length_penalty: 1.0
    chunk_length_s: 30
    return_timestamps: false

model:
  model_id: openai/whisper-large-v3
  model_type: whisper
  torch_dtype: float16
  load_in_4bit: true

dataset:
  dataset_id: google/WaxalNLP
  language: sna
  streaming: true
  sample_rate: 16000

submission:
  output_dir: submissions
  next_number: null
  schema:
    columns: [ID, Target]
  validate: true
