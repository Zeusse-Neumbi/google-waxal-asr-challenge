# ──────────────────────────────────────────────────────────────
# Whisper-medium configuration.
# ──────────────────────────────────────────────────────────────

defaults: [baseline]

raw:
  experiment:
    name: whisper_medium_finetune
    number: 002
    description: "Whisper-medium fine-tune on WAXAL."

model:
  model_id: openai/whisper-medium
  model_type: whisper
  torch_dtype: float16
  load_in_4bit: true

training:
  max_steps: 8000
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  max_seq_length: 448

optimizer:
  lr: 3.0e-6
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_ratio: 0.1

augmentation:
  enabled: true
  specaugment:
    time_mask_param: 30
    freq_mask_param: 15
    n_time_masks: 2
    n_freq_masks: 2
