# ──────────────────────────────────────────────────────────────
# Default configuration (base).
# All other configs inherit from this via `defaults: [baseline]`.
# ──────────────────────────────────────────────────────────────

defaults: []

# --- Project identity ---
project:
  name: waxal-asr
  version: 0.1.0
  seed: 42

# --- Paths ---
paths:
  data_raw: data/raw
  data_processed: data/processed
  data_interim: data/interim
  data_external: data/external
  metadata: data/metadata
  outputs: outputs
  checkpoints: checkpoints
  experiments: experiments
  submissions: submissions
  logs: outputs/logs
  cache: data/interim/cache

# --- Dataset source ---
dataset:
  dataset_id: google/WaxalNLP
  language: sna
  streaming: true
  sample_rate: 16000
  num_validation_examples: 200
  max_train_samples: null

# --- Audio defaults ---
audio:
  sample_rate: 16000
  mono: true
  normalize: peak
  min_duration_s: 0.5
  max_duration_s: 30.0

# --- Model ---
model:
  model_id: google/gemma-3n-E2B-it
  model_type: gemma3n
  torch_dtype: bfloat16
  load_in_4bit: false
  attn_implementation: eager
  device_map: auto

# --- LoRA ---
lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.0
  target_modules: [v_proj, o_proj]
  bias: none
  use_rslora: false
  use_dora: false

# --- Chat formatting ---
chat:
  system_message: "You are an assistant that transcribes speech accurately."
  user_message: "Please transcribe this audio."

# --- Reproducibility ---
repro:
  seed: 42
  deterministic: true
  benchmark: false
  cudnn_deterministic: true

# --- Training ---
training:
  max_steps: 500
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  max_seq_length: 64
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  eval_strategy: steps
  packing: false
  dataloader_num_workers: 2
  report_to: none
  remove_unused_columns: false

# --- Optimizer / scheduler ---
optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_ratio: 0.1
  num_cycles: 1

# --- Checkpointing ---
checkpoint:
  save_dir: ${paths.outputs}/models
  save_best: true
  save_last: true
  save_top_k: 3
  monitor: combined
  mode: min

# --- Evaluation ---
evaluation:
  batch_size: 32
  normalize_text: true
  lowercase: true
  strip_punctuation: true
  unicode_normalization: NFC
  metric: combined

# --- Tracking ---
tracking:
  backend: local
  wandb_project: waxal-asr
  wandb_entity: null
  log_every_n_steps: 50

# --- Logging ---
logging:
  level: INFO
  file: ${paths.logs}/run.log
  rotation: "10 MB"
  retention: "14 days"

# --- Hardware ---
hardware:
  device: auto
  fallback_to_cpu: true
