# ──────────────────────────────────────────────────────────────
# Default configuration (base).
# All other configs inherit from this via `defaults: [baseline]`.
# Never hardcode these values in src/ — read from config always.
# ──────────────────────────────────────────────────────────────

defaults: []

# --- Project identity ---
project:
  name: waxal-asr
  version: 0.1.0
  seed: 42

# --- Paths (override via env or CLI, never hardcode in code) ---
paths:
  data_raw: data/raw
  data_processed: data/processed
  data_interim: data/interim
  data_external: data/external
  metadata: data/metadata
  manifests: data/metadata/manifest.csv
  outputs: outputs
  checkpoints: checkpoints
  experiments: experiments
  submissions: submissions
  logs: outputs/logs
  cache: data/interim/cache

# --- Audio defaults ---
audio:
  sample_rate: 16000
  mono: true
  normalize: peak       # peak | rms | none
  min_duration_s: 0.5
  max_duration_s: 30.0

# --- Reproducibility ---
repro:
  seed: 42
  deterministic: true
  benchmark: false      # set true for fixed input shapes
  cudnn_deterministic: true

# --- Training defaults ---
training:
  epochs: 10
  batch_size: 16
  eval_batch_size: 32
  gradient_accumulation_steps: 1
  mixed_precision: fp16   # fp16 | bf16 | none
  gradient_checkpointing: false
  gradient_clip: 1.0
  num_workers: 4
  pin_memory: true

# --- Optimizer / scheduler ---
optimizer:
  name: adamw
  lr: 1.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine           # cosine | linear | constant
  warmup_ratio: 0.1
  num_cycles: 1

# --- Checkpointing ---
checkpoint:
  save_dir: ${paths.outputs}/models
  save_best: true
  save_last: true
  save_top_k: 3
  monitor: combined      # wer | cer | combined | val_loss
  mode: min

# --- Evaluation ---
evaluation:
  batch_size: 32
  normalize_text: true
  lowercase: true
  strip_punctuation: true
  unicode_normalization: NFC
  metric: combined        # wer | cer | combined

# --- Tracking ---
tracking:
  backend: local         # local | wandb | none
  wandb_project: waxal-asr
  wandb_entity: null
  log_every_n_steps: 50

# --- Logging ---
logging:
  level: INFO
  file: ${paths.logs}/run.log
  rotation: "10 MB"
  retention: "14 days"

# --- Hardware ---
hardware:
  device: auto           # auto | cpu | cuda | cuda:0
  fallback_to_cpu: true
