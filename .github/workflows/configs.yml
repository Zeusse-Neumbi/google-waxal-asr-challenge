name: Validate configs

on:
  pull_request:
  push:
    paths:
      - "configs/**"
      - ".github/workflows/configs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Validate YAML configs parse
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml
          failures = []
          for p in Path("configs").glob("*.yaml"):
              try:
                  with p.open() as f:
                      yaml.safe_load(f)
              except Exception as e:
                  failures.append(f"{p}: {e}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print(f"Validated {len(list(Path('configs').glob('*.yaml')))} configs.")
          PY
